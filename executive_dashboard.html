<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONLAP K/L - Executive Financial Monitoring & Bank Reconciliation Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: #0f172a;
      background: #f8fafc;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f8fafc; font-size: 13px; line-height: 1.5; }
    button, input, select { font: inherit; }
    button { border: 0; background: none; color: inherit; cursor: pointer; transition: all .16s ease; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    h1, h2, h3, h4, p { margin: 0; }
    svg { display: block; flex: 0 0 auto; vertical-align: middle; }

    /* Shell Layout */
    .app-shell { min-height: 100vh; background: #f8fafc; display: flex; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 30; width: 254px; background: #fff;
      border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; padding: 22px 14px 16px;
    }
    .brand { display: flex; gap: 11px; align-items: flex-start; padding: 0 6px 20px; cursor: pointer; user-select: none; }
    .brand:hover .brand-name { color: #1d4ed8; }
    .crest { width: 40px; height: 44px; flex: 0 0 auto; filter: drop-shadow(0 2px 3px rgba(15,23,42,.14)); }
    .crest svg { width: 100%; height: 100%; }
    .brand-name { color: #173b75; font-size: 19px; line-height: 1.15; font-weight: 800; letter-spacing: -.4px; transition: color .16s ease; }
    .brand-sub { margin-top: 2px; color: #64748b; font-size: 11px; white-space: nowrap; letter-spacing: -.1px; }
    .ministry-badge {
      display: inline-flex; margin-top: 7px; padding: 3px 7px; border: 1px solid #bfdbfe;
      border-radius: 4px; color: #1d4ed8; background: #eff6ff; font-size: 11px; line-height: 1; font-weight: 700; letter-spacing: .45px;
    }

    .nav-label { margin: 0 10px 8px; color: #94a3b8; font-size: 11px; font-weight: 700; letter-spacing: .9px; }
    .nav-list { display: flex; flex-direction: column; gap: 3px; }
    .nav-item {
      position: relative; width: 100%; min-height: 40px; display: flex; align-items: center;
      gap: 11px; border-radius: 7px; padding: 8px 10px; color: #475569; font-size: 12.5px; font-weight: 500; text-align: left;
    }
    .nav-item:hover { background: #f8fafc; color: #173b75; }
    .nav-item.active { color: #1d4ed8; background: #eff6ff; font-weight: 650; }
    .nav-item.active::before {
      content: ""; position: absolute; left: -14px; width: 4px; height: 24px; border-radius: 0 4px 4px 0; background: #2563eb;
    }
    .nav-item > span:not(.nav-badge) { line-height: 1.25; flex: 1; }
    .nav-badge { margin-left: auto; padding: 2px 7px; border-radius: 10px; background: #e2e8f0; color: #475569; font-size: 11px; font-weight: 700; }
    .nav-item.active .nav-badge { background: #dbeafe; color: #1d4ed8; }

    .nav-divider { height: 1px; margin: 12px 8px 8px; background: #e2e8f0; }
    .sidebar-bottom { margin-top: auto; padding-top: 14px; }
    .security-card {
      display: flex; align-items: center; gap: 9px; margin: 0 1px 11px; padding: 9px 10px;
      border: 1px solid #d1fae5; border-radius: 8px; background: #f0fdf7;
      cursor: pointer; transition: all .16s ease;
    }
    .security-card:hover {
      background: #e6fcf1; border-color: #a7f3d0;
      box-shadow: 0 2px 6px rgba(16,185,129,.16); transform: translateY(-1px);
    }
    .security-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: #059669; background: #d1fae5; }
    .security-title { display: flex; align-items: center; gap: 6px; color: #166534; font-size: 11.5px; font-weight: 700; }
    .status-dot { width: 7px; height: 7px; display: inline-block; border-radius: 50%; background: #10b981; box-shadow: 0 0 0 2px rgba(16,185,129,.2); }
    .security-copy { margin-top: 2px; color: #478267; font-size: 11px; }

    .user-widget {
      display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-top: 1px solid #e2e8f0;
      border-radius: 6px; cursor: pointer; transition: all .16s ease;
    }
    .user-widget:hover { background: #f1f5f9; }
    .avatar {
      width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto;
      border-radius: 50%; color: #fff; background: #173b75; font-size: 12px; font-weight: 700; box-shadow: 0 0 0 2px #e8eef7;
    }
    .user-copy { min-width: 0; flex: 1; }
    .user-name { color: #1e293b; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { margin-top: 1px; color: #64748b; font-size: 11px; }
    .logout {
      width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px;
      padding: 9px; margin-top: 6px; color: #64748b; border: 1px solid #e2e8f0; border-radius: 7px; font-size: 12px; font-weight: 600;
      transition: all .16s ease; cursor: pointer;
    }
    .logout:hover { color: #b91c1c; border-color: #fecaca; background: #fef2f2; }

    /* Signed Out Screen */
    .signed-out-shell {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%); padding: 24px;
    }
    .signed-out-card {
      background: #ffffff; border-radius: 16px; max-width: 480px; width: 100%;
      padding: 42px 36px; text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,.4);
      border: 1px solid rgba(255,255,255,.1);
    }
    .signed-out-crest { width: 56px; height: 62px; margin: 0 auto 16px; filter: drop-shadow(0 4px 6px rgba(15,23,42,.2)); }
    .signed-out-title { color: #0f172a; font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .signed-out-desc { color: #64748b; font-size: 13px; line-height: 1.6; margin-bottom: 24px; }
    .signed-out-badge {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px;
      background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 99px; color: #15803d;
      font-size: 11.5px; font-weight: 650; margin-bottom: 22px;
    }
    .signed-out-account {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px;
      padding: 14px; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; text-align: left;
    }

    /* Switch Toggles for Settings */
    .switch-toggle {
      width: 44px; height: 24px; border-radius: 12px; background: #cbd5e1;
      position: relative; cursor: pointer; transition: background .2s ease; border: 0; padding: 2px;
      flex-shrink: 0;
    }
    .switch-toggle.active { background: #2563eb; }
    .switch-toggle .switch-thumb {
      width: 20px; height: 20px; border-radius: 50%; background: #ffffff;
      display: block; transition: transform .2s ease; box-shadow: 0 1px 3px rgba(0,0,0,.25);
    }
    .switch-toggle.active .switch-thumb { transform: translateX(20px); }

    /* Security Modal Specs */
    .sec-spec-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
    .sec-spec-card {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px;
    }
    .sec-spec-card span { font-size: 11px; color: #64748b; display: block; }
    .sec-spec-card strong { font-size: 13px; color: #0f172a; margin-top: 2px; display: block; }

    /* Compliance & Users Cards */
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .unit-stat-card {
      background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 18px;
      transition: all .16s ease;
    }
    .unit-stat-card:hover { border-color: #cbd5e1; box-shadow: 0 4px 12px rgba(15,23,42,.05); }
    .unit-stat-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .unit-stat-title { font-size: 13.5px; font-weight: 700; color: #0f172a; }
    .unit-stat-meta { font-size: 11.5px; color: #64748b; margin-top: 2px; }
    .unit-stat-pct { font-size: 22px; font-weight: 800; color: #1d4ed8; }
    .unit-stat-pct.green { color: #059669; }

    /* Audit Stream Items */
    .audit-stream { display: flex; flex-direction: column; gap: 12px; }
    .audit-row-card {
      background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px;
      display: flex; gap: 14px; align-items: flex-start; transition: all .16s ease;
    }
    .audit-row-card:hover { border-color: #cbd5e1; background: #fafafa; }
    .audit-row-badge { margin-left: auto; align-self: flex-start; }

    /* Topbar */
    .main-shell { margin-left: 254px; flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar {
      height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px;
      background: rgba(255,255,255,.96); border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 25; backdrop-filter: blur(8px);
    }
    .breadcrumbs { display: flex; align-items: center; gap: 6px; color: #94a3b8; font-size: 12px; }
    .breadcrumbs strong { color: #334155; font-weight: 650; }
    .top-actions { display: flex; align-items: center; gap: 14px; position: relative; }
    .live-pill, .live-feed {
      display: inline-flex; align-items: center; gap: 7px; border: 1px solid #d1fae5;
      border-radius: 99px; padding: 5px 11px; color: #047857; background: #f0fdf7; font-size: 11.5px; font-weight: 650;
    }
    .vertical-divider { width: 1px; height: 24px; background: #e2e8f0; }
    .icon-button {
      position: relative; width: 36px; height: 36px; display: grid; place-items: center;
      border: 1px solid #e2e8f0; border-radius: 7px; color: #475569; background: #fff;
    }
    .icon-button:hover { background: #f8fafc; color: #0f172a; border-color: #cbd5e1; }
    .notification-count {
      position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; display: grid;
      place-items: center; border: 2px solid #fff; border-radius: 50%; color: #fff; background: #ef4444; font-size: 10px; font-weight: 750;
    }
    .top-avatar { width: 34px; height: 34px; box-shadow: none; }

    /* Content Area */
    .content { padding: 22px 30px 40px; max-width: 1600px; margin: 0 auto; width: 100%; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .eyebrow { margin-bottom: 4px; color: #2563eb; font-size: 11.5px; line-height: 1.2; font-weight: 750; letter-spacing: .9px; }
    .eyebrow span { color: #94a3b8; }
    .page-title { color: #0f172a; font-size: 26px; line-height: 1.2; font-weight: 750; letter-spacing: -.6px; }
    .page-subtitle { margin-top: 4px; color: #64748b; font-size: 13px; }
    .period-note { display: flex; align-items: center; gap: 8px; color: #64748b; font-size: 12px; }
    .period-note strong { color: #1e293b; font-weight: 650; }

    /* Toolbar & Filters */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 14px; margin-bottom: 22px; background: #fff; border: 1px solid #e2e8f0; border-radius: 9px;
      box-shadow: 0 1px 2px rgba(15,23,42,.03); flex-wrap: wrap;
    }
    .filter-group, .toolbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .select-wrap {
      display: flex; align-items: center; gap: 7px; padding: 0 10px; height: 36px;
      border: 1px solid #cbd5e1; border-radius: 7px; background: #fff; color: #475569;
    }
    .select-wrap select { border: 0; background: none; font-size: 12.5px; font-weight: 600; color: #1e293b; cursor: pointer; padding-right: 4px; }
    .toolbar-actions .secondary-button, .toolbar-actions .primary-button { height: 36px; }

    .primary-button, .secondary-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 0 14px; border-radius: 7px; font-size: 12.5px; font-weight: 650;
    }
    .primary-button { background: #2563eb; color: #fff; }
    .primary-button:hover { background: #1d4ed8; }
    .secondary-button { background: #fff; border: 1px solid #cbd5e1; color: #334155; }
    .secondary-button:hover { background: #f8fafc; border-color: #94a3b8; }
    .export-wrap { position: relative; }

    /* Popovers */
    .popover {
      position: absolute; top: calc(100% + 8px); right: 0; z-index: 40; width: 220px;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 10px 25px rgba(15,23,42,.15);
      padding: 6px;
    }
    .popover button {
      width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 10px;
      border-radius: 6px; font-size: 12px; font-weight: 550; text-align: left; color: #334155;
    }
    .popover button:hover { background: #f1f5f9; color: #0f172a; }
    .notification-popover { width: 340px; padding: 0; }
    .popover-title {
      padding: 12px 14px; font-size: 12.5px; font-weight: 700; color: #0f172a;
      border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;
    }
    .notification-row {
      display: flex; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #f1f5f9; text-align: left;
    }
    .notification-row:hover { background: #f8fafc; }

    /* KPI Cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 22px; }
    .card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 18px;
      box-shadow: 0 1px 3px rgba(15,23,42,.03);
    }
    .kpi-card { display: flex; flex-direction: column; justify-content: space-between; min-height: 160px; }
    .kpi-compliance { background: linear-gradient(135deg, #ffffff 60%, #eff6ff 100%); border-color: #bfdbfe; }
    .kpi-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .kpi-title { color: #64748b; font-size: 12.5px; font-weight: 600; }
    .kpi-icon { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 7px; }
    .kpi-icon.blue { color: #2563eb; background: #eff6ff; }
    .kpi-icon.purple { color: #7c3aed; background: #f5f3ff; }
    .kpi-icon.teal { color: #0d9488; background: #f0fdfa; }
    .kpi-icon.amber { color: #d97706; background: #fffbeb; }

    .kpi-body { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .kpi-metric { color: #0f172a; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -.6px; }
    .kpi-metric span { font-size: 18px; font-weight: 700; }
    .kpi-metric small { font-size: 12px; color: #64748b; font-weight: 500; letter-spacing: 0; }
    .kpi-trend { margin-top: 4px; color: #059669; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .kpi-footer {
      margin-top: 14px; padding-top: 11px; border-top: 1px solid #f1f5f9;
      color: #64748b; font-size: 11.5px; display: flex; align-items: center; justify-content: space-between;
    }
    .kpi-progress { height: 6px; border-radius: 99px; background: #f1f5f9; overflow: hidden; margin-top: 10px; display: flex; gap: 2px; }
    .kpi-progress span { height: 100%; border-radius: 99px; }

    /* Ring SVG */
    .compliance-ring { position: relative; width: 54px; height: 54px; }
    .compliance-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: #e2e8f0; stroke-width: 4.5; }
    .ring-val { fill: none; stroke: #2563eb; stroke-width: 4.5; stroke-dasharray: 119.4; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
    .ring-center-icon { position: absolute; inset: 0; display: grid; place-items: center; color: #2563eb; }

    /* Analytics Grid */
    .analytics-grid { display: grid; grid-template-columns: 1.7fr 1.1fr; gap: 16px; margin-bottom: 22px; }
    .panel-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .panel-title { color: #0f172a; font-size: 14px; font-weight: 700; }
    .panel-subtitle { margin-top: 2px; color: #64748b; font-size: 11.5px; }

    /* Unit Progress Rows */
    .unit-list { display: flex; flex-direction: column; gap: 14px; }
    .unit-row { display: grid; grid-template-columns: 180px 1fr 65px; align-items: center; gap: 12px; }
    .unit-name { color: #1e293b; font-size: 12px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .unit-meta { color: #94a3b8; font-size: 11px; }
    .bar-track { height: 10px; border-radius: 99px; background: #f1f5f9; overflow: hidden; display: flex; gap: 2px; }
    .bar-track > span { height: 100%; border-radius: 99px; }
    .bar-green { background: #10b981; }
    .bar-blue { background: #2563eb; }
    .bar-amber { background: #f59e0b; }
    .bar-red { background: #ef4444; }
    .unit-score { text-align: right; font-size: 12.5px; font-weight: 700; color: #1e293b; }

    /* Donut Chart Container */
    .donut-layout { display: flex; align-items: center; gap: 20px; padding: 10px 0; }
    .donut-chart { position: relative; width: 140px; height: 140px; flex: 0 0 auto; }
    .donut-chart svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .donut-pct { color: #0f172a; font-size: 24px; font-weight: 800; line-height: 1; }
    .donut-label { color: #64748b; font-size: 10.5px; font-weight: 600; margin-top: 2px; }
    .legend-list { display: flex; flex-direction: column; gap: 9px; flex: 1; }
    .legend-item { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; }
    .legend-item-left { display: flex; align-items: center; gap: 8px; color: #475569; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Operations Grid */
    .operations-grid { display: grid; grid-template-columns: 1.8fr 1.1fr; gap: 16px; margin-bottom: 22px; }
    .table-tools { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .chip {
      padding: 5px 11px; border-radius: 99px; border: 1px solid #e2e8f0; background: #fff;
      color: #64748b; font-size: 11.5px; font-weight: 600; cursor: pointer;
    }
    .chip:hover { border-color: #cbd5e1; color: #1e293b; }
    .chip.active { background: #eff6ff; border-color: #93c5fd; color: #1d4ed8; font-weight: 700; }

    .table-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
    th {
      padding: 10px 12px; color: #64748b; font-size: 11px; font-weight: 700; letter-spacing: .5px;
      border-bottom: 1px solid #e2e8f0; background: #f8fafc; text-transform: uppercase;
    }
    td { padding: 12px 12px; border-bottom: 1px solid #f1f5f9; color: #334155; vertical-align: middle; }
    tr:hover td { background: #f8fafc; }
    .satker { display: flex; align-items: center; gap: 10px; }
    .satker-avatar {
      width: 32px; height: 32px; border-radius: 7px; display: grid; place-items: center;
      font-size: 11px; font-weight: 750; flex: 0 0 auto;
    }
    .satker-blue { background: #dbeafe; color: #1d4ed8; }
    .satker-purple { background: #ede9fe; color: #6d28d9; }
    .satker-teal { background: #ccfbf1; color: #0f766e; }
    .satker-amber { background: #fef3c7; color: #b45309; }
    .satker strong { display: block; color: #0f172a; font-size: 12.5px; font-weight: 650; }
    .satker span { display: block; color: #94a3b8; font-size: 11px; }

    .unit-tag {
      display: inline-block; padding: 3px 7px; border-radius: 4px; font-size: 11px;
      font-weight: 600; background: #f1f5f9; color: #475569;
    }
    .variance { color: #dc2626; font-weight: 750; background: #fef2f2; padding: 3px 8px; border-radius: 5px; border: 1px solid #fee2e2; }
    .review-button {
      padding: 5px 10px; border-radius: 6px; font-size: 11.5px; font-weight: 650;
      color: #2563eb; background: #eff6ff; border: 1px solid #bfdbfe;
    }
    .review-button:hover { background: #2563eb; color: #fff; }

    .table-footer {
      display: flex; justify-content: space-between; align-items: center; padding-top: 12px;
      margin-top: 10px; border-top: 1px solid #f1f5f9; color: #64748b; font-size: 12px;
    }
    .text-link { color: #2563eb; font-weight: 650; display: inline-flex; align-items: center; gap: 4px; }
    .text-link:hover { text-decoration: underline; }

    /* Feed List */
    .feed { display: flex; flex-direction: column; gap: 14px; padding: 4px 0 10px; }
    .feed-item { display: flex; gap: 12px; position: relative; }
    .feed-icon {
      width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
      flex: 0 0 auto; z-index: 2;
    }
    .feed-icon.green { background: #d1fae5; color: #059669; }
    .feed-icon.blue { background: #dbeafe; color: #2563eb; }

    let toastTimer = null;
    function notify(text) {
      state.toast = text;
      render();
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        state.toast = "";
        render();
      }, 4000);
    }

    function getPeriodData() {
      const key = `${state.year}-${state.semester}`;
      return PERIOD_DATA[key] || PERIOD_DATA["2026-1"];
    }

    function exportFile(type) {
      state.popover = null;
      if (type === "PDF") {
        window.print();
        return;
      }
      const data = getPeriodData();
      const rows = [
        ["Nama Satker", "Kode Satker", "Unit Eselon 1", "Kas Riil BKU", "Rekening Koran", "Selisih Rekonsiliasi", "Status"],
        ...data.findings.map(f => [f.name, f.code, f.unit, f.cash, f.bank, f.variance, f.status])
      ];
      const csv = "\uFEFF" + rows.map(r => r.join(";")).join("\r\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `MONLAP-KEMENKEU-KONSOLIDASI-${state.year}-SEM${state.semester}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      notify(`File CSV konsolidasi TA ${state.year} Semester ${state.semester} berhasil diunduh.`);
    }

    function sendKlarifikasi(code, name) {
      const p = getPeriodData();
      const item = p.findings.find(f => f.code === code);
      if (item) {
        item.status = "Klarifikasi Terkirim";

      state.reviewModalSatker = null;
      notify(`Surat instruksi klarifikasi resmi PMK berhasil diterbitkan & dikirim ke ${name}.`);
      render();
    }

        state.popover = null;
        render();

      if (state.popover === "export" && exportWrap && !exportWrap.contains(e.target)) {

      if (state.activeTab === "settings") return renderSettingsView();
      return renderOverview(data, 0, [], 0);
    }

                    <td><strong>${u.role}</strong> (${u.roleBadge})</td>
                    <td><span class="pill ${u.status === 'Online' ? 'success' : (u.status === 'Aktif' ? 'blue' : 'amber')}">${u.status}</span></td>
                    <td>${u.lastActive}</td>
                    <td>
                      <button class="secondary-button" style="padding: 4px 8px; font-size: 11.5px;" onclick="state.activeDetailUser = ${JSON.stringify(u).replace(/"/g, '&quot;')}; render();">
                        Detail Akses
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // 5. LOG AUDIT EKSEKUTIF
    function renderAuditView(data) {
      const logs = data.auditLogs || [];
      const filtered = logs.filter(l => {
        if (state.auditEventFilter !== "all" && l.status !== state.auditEventFilter) return false;
        if (state.search && !l.actor.toLowerCase().includes(state.search.toLowerCase()) && !l.action.toLowerCase().includes(state.search.toLowerCase())) return false;
        return true;
      });

      return `
        <div class="card workspace-view">
          <div class="workspace-header">
            <div>
              <h2>Log Audit Eksekutif & Jejak Transaksi Nasional</h2>
              <p style="font-size: 12px; color: #64748b; margin-top: 4px;">Pencatatan elektronik seluruh tindakan verifikasi, otorisasi, dan instruksi klarifikasi PMK 104</p>
            </div>
            <div class="search-input">
              ${icon("search", 15)}
              <input placeholder="Cari nama pejabat atau aksi..." value="${state.search}" oninput="state.search = this.value; render();" />
            </div>
          </div>

          <div class="table-tools">
            <button class="chip ${state.auditEventFilter === 'all' ? 'active' : ''}" onclick="state.auditEventFilter = 'all'; render();">Semua Log (${logs.length})</button>
            <button class="chip ${state.auditEventFilter === 'Terverifikasi' ? 'active' : ''}" onclick="state.auditEventFilter = 'Terverifikasi'; render();">Terverifikasi</button>
            <button class="chip ${state.auditEventFilter === 'Disetujui' ? 'active' : ''}" onclick="state.auditEventFilter = 'Disetujui'; render();">Disetujui</button>
            <button class="chip ${state.auditEventFilter === 'Perlu Klarifikasi' ? 'active' : ''}" onclick="state.auditEventFilter = 'Perlu Klarifikasi'; render();">Perlu Klarifikasi</button>
          </div>

          <div class="audit-stream" style="margin-top: 14px;">
            ${filtered.map(l => `
              <div class="audit-row-card">
                <div class="feed-icon ${l.tone}" style="width: 34px; height: 34px;">${icon(l.icon, 16)}</div>
                <div style="flex: 1;">
                  <div style="display: flex; justify-content: space-between; align-items: baseline;">
                    <strong style="color: #0f172a; font-size: 13px;">${l.actor} <span style="font-weight: 500; color: #64748b;">(${l.role})</span></strong>
                    <span style="font-size: 11.5px; color: #94a3b8;">${l.time}</span>
                  </div>
                  <p style="color: #1e293b; font-size: 12.5px; margin-top: 3px; font-weight: 600;">${l.action}</p>
                  <p style="color: #64748b; font-size: 11.5px; margin-top: 2px;">Target: ${l.target}</p>
                  <code style="display: inline-block; font-size: 11px; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; color: #475569; margin-top: 6px;">
                    Digital Signature: ${l.hash}
                  </code>
                </div>
                <div class="audit-row-badge">
                  <span class="pill ${l.status === 'Terverifikasi' || l.status === 'Disetujui' || l.status === 'Aman' ? 'success' : 'amber'}">${l.status}</span>
                  <button class="text-link" style="margin-top: 8px; font-size: 11.5px; display: block;" onclick="state.activeDetailAudit = ${JSON.stringify(l).replace(/"/g, '&quot;')}; render();">
                    Bukti Audit ${icon("arrow", 12)}
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // 6. PENGATURAN & PROFIL
    function renderSettingsView() {
      return `
        <div class="card workspace-view">
          <div class="workspace-header">
            <div>
              <h2>Pengaturan & Profil Pengguna Eksekutif</h2>
              <p style="font-size: 12px; color: #64748b; margin-top: 4px;">Kelola preferensi notifikasi peringatan dini, preferensi rapat, dan identitas akun pimpinan</p>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 20px;">
            <!-- Profil Card -->
            <div style="padding: 18px; border: 1px solid #e2e8f0; border-radius: 10px; background: #f8fafc; display: flex; align-items: center; gap: 16px;">
              <div class="avatar" style="width: 48px; height: 48px; font-size: 18px;">AS</div>
              <div>
                <strong style="font-size: 16px; color: #0f172a; display: block;">Dr. Agus Setiawan</strong>
                <span style="font-size: 12.5px; color: #64748b; display: block; margin-top: 2px;">Sekretaris Jenderal · NIP. 197408121999031002 · Tingkat K/L Pusat Kementerian</span>
                <span class="pill success" style="margin-top: 6px;">Otoritas Pimpinan Nasional</span>
              </div>
            </div>

            <!-- Toggles Card -->
            <div style="padding: 18px; border: 1px solid #e2e8f0; border-radius: 10px; display: flex; flex-direction: column; gap: 16px;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <strong style="font-size: 13px; color: #0f172a;">Notifikasi Email Peringatan Dini</strong>
                  <p style="font-size: 12px; color: #64748b; margin-top: 2px;">Kirim otomatis email resmi saat ada selisih kas satker di atas Rp 200 Juta.</p>
                </div>
                <button
                  class="switch-toggle ${state.toggleEmail ? 'active' : ''}"
                  onclick="state.toggleEmail = !state.toggleEmail; notify('Notifikasi Email Peringatan Dini: ' + (state.toggleEmail ? 'Diaktifkan' : 'Dinonaktifkan')); render();"
                >
                  <span class="switch-thumb"></span>
                </button>
              </div>

              <div style="height: 1px; background: #f1f5f9;"></div>

              <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <strong style="font-size: 13px; color: #0f172a;">Auto-Broadcast Surat Klarifikasi PMK 104</strong>
                  <p style="font-size: 12px; color: #64748b; margin-top: 2px;">Kirim draf surat klarifikasi otomatis ke Rektor/KPA pada hari ke-3 selisih belum terselesaikan.</p>
                </div>
                <button
                  class="switch-toggle ${state.togglePmk ? 'active' : ''}"
                  onclick="state.togglePmk = !state.togglePmk; notify('Auto-Broadcast Klarifikasi PMK: ' + (state.togglePmk ? 'Diaktifkan' : 'Dinonaktifkan')); render();"
                >
                  <span class="switch-thumb"></span>
                </button>
              </div>

              <div style="height: 1px; background: #f1f5f9;"></div>

              <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <strong style="font-size: 13px; color: #0f172a;">Mode Presentasi Rapat Eksekutif</strong>
                  <p style="font-size: 12px; color: #64748b; margin-top: 2px;">Sembunyikan rincian kode akun sensitif saat presentasi di layar proyektor.</p>
                </div>
                <button
                  class="switch-toggle ${state.togglePres ? 'active' : ''}"
                  onclick="state.togglePres = !state.togglePres; notify('Mode Presentasi Rapat: ' + (state.togglePres ? 'Diaktifkan' : 'Dinonaktifkan')); render();"
                >
                  <span class="switch-thumb"></span>
                </button>
              </div>
            </div>

            <!-- Form Ganti Password Demo -->
            <div style="padding: 18px; border: 1px solid #e2e8f0; border-radius: 10px;">
              <strong style="font-size: 13.5px; color: #0f172a; display: block; margin-bottom: 4px;">Keamanan Kata Sandi Mandiri</strong>
              <p style="font-size: 12px; color: #64748b; margin-bottom: 14px;">Perbarui kata sandi akun eksekutif secara berkala sesuai standar audit BPK & Kemenkeu.</p>
              
              <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px;">
                <div>
                  <label style="font-size: 11.5px; color: #475569; display: block; margin-bottom: 4px;">Kata Sandi Saat Ini</label>
                  <input type="password" placeholder="••••••••" style="width: 100%; height: 36px; padding: 0 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px;" />
                </div>
                <div>
                  <label style="font-size: 11.5px; color: #475569; display: block; margin-bottom: 4px;">Kata Sandi Baru</label>
                  <input type="password" placeholder="••••••••" style="width: 100%; height: 36px; padding: 0 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px;" />
                </div>
                <div>
                  <label style="font-size: 11.5px; color: #475569; display: block; margin-bottom: 4px;">Konfirmasi Kata Sandi</label>
                  <input type="password" placeholder="••••••••" style="width: 100%; height: 36px; padding: 0 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px;" />
                </div>
              </div>

              <button class="primary-button" onclick="notify('Kata sandi pejabat berhasil diperbarui secara aman.');">
                ${icon("check", 14)} Simpan Perubahan Kata Sandi
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // --- MODAL COMPONENT REVIEW SATKER ---
    function openReviewModal(code) {
      const data = getPeriodData();
      const satker = data.findings.find(f => f.code === code) || data.findings[0];
      state.reviewModalSatker = satker;
      render();
    }

    function renderReviewModal(satker) {
      return `
        <div class="modal-backdrop" onmousedown="state.reviewModalSatker = null; render();">
          <div class="modal" onmousedown="event.stopPropagation()">
            <div class="modal-header">
              <div>
                <div class="modal-eyebrow">MEJA AUDIT REKONSILIASI · ${satker.name.toUpperCase()}</div>
                <div class="modal-title">Tinjauan Selisih Rekonsiliasi Kas vs Bank</div>
              </div>
              <button class="modal-close" onclick="state.reviewModalSatker = null; render();" aria-label="Tutup modal">
                ${icon("close", 18)}
              </button>
            </div>

            <div class="modal-body">
              <div class="modal-context">
                <div class="satker-avatar ${satker.colorClass}" style="width: 36px; height: 36px; font-size: 13px;">${satker.initials}</div>
                <div>
                  <strong>${satker.name}</strong>
                  <span>Kode Satker ${satker.code} · ${satker.unit}</span>
                </div>
                <span class="review-status">${satker.status}</span>
              </div>

              <div class="metric-comparison">
                <div>
                  <span>Saldo Kas Riil (BKU)</span>
                  <strong>${satker.cash}</strong>
                  <small>Per 30 Juni ${state.year}</small>
                </div>
                <div>
                  <span>Saldo Rekening Koran</span>
                  <strong>${satker.bank}</strong>
                  <small>Rekening operasional bank</small>
                </div>
                <div class="variance-card">
                  <span>Selisih Rekonsiliasi</span>
                  <strong>${satker.variance}</strong>
                  <small>Belum dapat dijelaskan</small>
                </div>
              </div>

              <div class="rule-box">
                <div class="rule-icon">${icon("shield", 20)}</div>
                <div>
                  <strong>Ketentuan Rekonsiliasi Berdasarkan PMK</strong>
                  <p>Sesuai PMK No. 104/PMK.05/2023, selisih saldo kas dan bank wajib diklarifikasi oleh KPA paling lambat 5 hari kerja sejak notifikasi diterbitkan.</p>
                </div>
              </div>

              <div class="modal-note">
                <span>Catatan pemeriksa</span>
                <div>Mohon lampirkan Berita Acara Rekonsiliasi (BAR) dan mutasi rekening koran bank persepsi periode Juni ${state.year}.</div>
              </div>
            </div>

            <div class="modal-footer">
              <button class="secondary-button" onclick="state.reviewModalSatker = null; render();">
                Tutup Tinjauan
              </button>
              <button class="primary-button" onclick="sendKlarifikasi('${satker.code}', '${satker.name}')">
                ${icon("file", 16)} Kirim Surat Klarifikasi Resmi ke Rektor / KPA
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // Jalankan render awal
    render();
  </script>
</body>
</html>
