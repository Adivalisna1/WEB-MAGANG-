        state.toast = "";
        render();
      }, 4000);

    function exportReport(format) {
      state.popover = null;
      if (format === "PDF") {
        window.print();
        return;
      }
      const rows = [
        ["Satker", "Unit Eselon 1", "Saldo Kas Riil", "Saldo Rekening Koran", "Selisih"],
        ...records.map(r => [r.name, r.unit, r.real, r.bank, r.diff])
      ];
      const blob = new Blob(["\uFEFF" + rows.map(r => r.join(";")).join("\r\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `MONLAP-rekonsiliasi-${state.year}-S${state.semester}.csv`;
      link.click();
      URL.revokeObjectURL(url);
      notify("Laporan CSV berhasil diekspor. Buka dengan Excel.");
    }

                <p>Terima ringkasan kepatuhan dan peringatan selisih melalui email.</p>
              </div>
              <button class="toggle ${state.emailAlerts ? 'on' : ''}" role="switch" onclick="state.emailAlerts = !state.emailAlerts; notify('Preferensi notifikasi disimpan.'); render();">
                <span></span>
              </button>
            </div>
            <div class="settings-row">
              <div>
                <strong>Profil pejabat</strong>
                <p>Dr. Agus Setiawan · Sekretaris Jenderal · Pusat Kementerian</p>
              </div>
              <span class="badge green-badge">Akun terverifikasi</span>
            </div>
          </div>
        `;
      } else if (isAudit) {
        inner = `
          <div class="audit-list">
            ${filteredActivities.map(a => `
              <div class="audit-item">
                <span class="feed-icon ${a.color}">${iconSvg(a.icon, 18)}</span>
                <div>
                  <h3>${a.name}</h3>
                  <p>${a.detail}</p>
                </div>
                <span class="badge ${a.color}-badge">${a.badge}</span>
                <small>${a.time}</small>
              </div>
            `).join('')}
          </div>
        `;
      } else if (isCompliance) {
        inner = `
          <div class="compliance-list">
            ${filteredUnits.map(u => `
              <div class="settings-row">
                <div>
                  <strong>${u.name}</strong>
                  <p>${u.count}</p>
                </div>
                <div class="workspace-progress">
                  <div class="stacked-bar">
                    <span class="bar-verified" style="width: ${u.percent}%"></span>
                  </div>
                  <strong>${u.percent}%</strong>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else {
        inner = `
          <div class="table-scroll">
            <table class="workspace-table">
              <thead>
                <tr>
                  <th>Nama Satker</th>
                  <th>Unit Eselon 1</th>
                  <th>${state.activeNav === 'Dokumen Nasional' ? 'Dokumen' : 'Saldo Kas Riil'}</th>
                  <th>${state.activeNav === 'Dokumen Nasional' ? 'Periode' : 'Saldo Rekening Koran'}</th>
                  <th>Status</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody>
                ${filteredRecords.map(r => `
                  <tr>
                    <td>
                      <div class="satker-cell">
                        <span class="satker-avatar ${r.color}">${r.initials}</span>
                        <div>
                          <strong>${r.name}</strong>
                          <span>${r.code}</span>
                        </div>
                      </div>
                    </td>
                    <td>${r.unit}</td>
                    <td>${state.activeNav === 'Dokumen Nasional' ? 'Laporan Keuangan Semester' : r.real}</td>
                    <td>${state.activeNav === 'Dokumen Nasional' ? 'S' + state.semester + ' / ' + state.year : r.bank}</td>
                    <td><span class="badge red-badge">Perlu review</span></td>
                    <td>
                      <button class="review-button" onclick="reviewRecordByCode('${r.code}')">
                        Review ${iconSvg('chevron', 13)}
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
            ${filteredRecords.length === 0 ? `<p class="empty-state">Tidak ada data yang sesuai dengan pencarian.</p>` : ''}
          </div>
        `;
      }

      return `
        <section class="panel workspace-panel">
          <div class="panel-header">
            <div>
              <h2>${state.activeNav}</h2>
              <p>${isSettings ? 'Kelola preferensi akun dan notifikasi eksekutif' : 'Data nasional · Tahun anggaran ' + state.year + ' · Semester ' + state.semester}</p>
            </div>
            ${!isSettings ? `
              <div class="search-field">
                ${iconSvg('search', 16)}
                <input placeholder="Cari nama atau unit..." value="${state.search}" oninput="state.search = this.value; render();" />
              </div>
            ` : ''}
          </div>
          ${inner}
          <div class="workspace-note">
            Data demonstrasi untuk pratinjau dashboard. Tidak terhubung ke sistem luar.
          </div>
        </section>
      `;
    }

    // --- MODAL TRIGGERS ---
    function reviewRecordByCode(code) {
      const rec = records.find(r => r.code === code) || records[0];
      review(rec);
    }

    function open11SatkerModal() {
      state.modal = {
        title: "11 satker belum menyetor laporan",
        contentHtml: `
          <p class="modal-description">11 satker belum menyampaikan laporan pada periode ini. Batas pelaporan: 30 Juni ${state.year}.</p>
          <div class="notice">
            ${iconSvg('clock')}
            <p>Pengingat akan dikirim ke operator satker dan unit Eselon 1 pembina.</p>
          </div>
          <button class="primary-button modal-action" onclick="state.modal = null; notify('Pengingat pelaporan dikirim ke 11 satker.'); render();">
            Kirim pengingat ${iconSvg('arrow', 16)}
          </button>
        `
      };
      render();
    }

    function openKepatuhanInfoModal() {
      state.modal = {
        title: "Tentang performa kepatuhan",
        contentHtml: `
          <p class="modal-description">
            Persentase kepatuhan menunjukkan laporan terverifikasi dibanding total kewajiban pelaporan pada masing-masing unit Eselon 1. Data mencakup semester ${state.semester}, tahun anggaran ${state.year}.
          </p>
        `
      };
      render();
    }

    function openUnitModal(name, count, percent, pending, revise) {
      state.modal = {
        title: name,
        contentHtml: `
          <p class="modal-description">Ringkasan kepatuhan ${count} untuk semester ${state.semester}, TA ${state.year}.</p>
          <div class="review-values">
            <div>
              <span>Terverifikasi</span>
              <strong>${percent}%</strong>
            </div>
            <div>
              <span>Dalam proses</span>
              <strong>${pending}%</strong>
            </div>
            <div>
              <span>Perlu revisi</span>
              <strong>${revise}%</strong>
            </div>
          </div>
        `
      };
      render();
    }

    function openActivityDetail(name) {
      const act = activities.find(a => a.name === name) || activities[0];
      state.popover = null;
      state.modal = {
        title: act.name,
        contentHtml: `
          <span class="badge ${act.color}-badge" style="margin-bottom: 12px; display: inline-block;">${act.badge}</span>
          <p class="modal-description">${act.detail}</p>
          <p class="modal-description">Aktivitas dicatat ${act.time}. Jejak audit tersimpan secara otomatis.</p>
        `
      };
      render();
    }

    function openHelpModal() {
      state.modal = {
        title: "Pusat bantuan MONLAP",
        contentHtml: `
          <p class="modal-description">Gunakan dashboard untuk memantau kepatuhan nasional, meninjau selisih rekonsiliasi, dan melihat aktivitas persetujuan unit Eselon 1.</p>
          <div class="notice">
            ${iconSvg('help')}
            <p>Ini adalah dashboard demonstrasi. Seluruh angka dan identitas merupakan data contoh, bukan laporan pemerintah aktual.</p>
          </div>
        `
      };
      render();
    }

    function confirmLogoutModal() {
      state.modal = {
        title: "Keluar dari dashboard?",
        contentHtml: `
          <p class="modal-description">Sesi eksekutif Anda akan diakhiri. Anda dapat kembali ke dashboard demo kapan saja.</p>
          <button class="primary-button modal-action" onclick="state.modal = null; state.isSignedOut = true; render();">
            Ya, keluar ${iconSvg('logout', 16)}
          </button>
        `
      };
      render();
    }

    function updateTimeAndRefresh() {
      state.lastUpdate = new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }).replace(".", ":");
      notify("Data dashboard berhasil diperbarui.");
    }

    // Initial render
    render();
  </script>
</body>
</html>
